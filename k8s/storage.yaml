apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-pipeline-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /data/summarizer-pipeline-shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-pipeline-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
